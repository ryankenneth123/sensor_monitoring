<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Monitoring Dashboard</title>
    <!-- Bootstrap para sa layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js para sa graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 1. DARK TECH BACKGROUND */
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }
        
        /* 2. MODERN CARD DESIGN */
        .card { 
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s, box-shadow 0.3s; 
            color: #f8fafc;
        }
        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }
        
        /* Flexbox para pantay ang laman ng status cards */
        .status-card-body { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 180px;
        }

        /* Flexbox para sa graph cards */
        .graph-card-body { 
            padding: 1.5rem; 
            min-height: 280px;
        }

        /* Muted text color para sa mga labels */
        .text-secondary { color: #94a3b8 !important; }
        
        /* Glowing Title Effect */
        .glow-text {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            color: #38bdf8 !important;
        }

        /* Status Dot Indicator */
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .dot-live { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .dot-error { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center mb-2 fw-bold glow-text">🌡️ Gas & Vibration Monitoring</h2>
        <p class="text-center text-secondary mb-4">
            <span class="status-dot dot-live" id="status-dot"></span>
            <span id="status-text">IoT Real-time Dashboard</span>
        </p>
        
        <!-- Status Cards -->
        <div class="row text-center mb-4">
            <!-- Gas Card -->
            <div class="col-md-4 mb-3">
                <div class="card h-100 border-top border-primary border-4">
                    <div class="status-card-body">
                        <h5 class="card-title text-secondary mb-2">Gas Level (MQ-2)</h5>
                        <h1 class="display-4 text-primary fw-bold" id="gas-value" style="text-shadow: 0 0 15px rgba(13, 110, 253, 0.5);">0</h1>
                        <span class="badge bg-dark border border-secondary mt-3 px-3 py-2">Threshold: 500</span>
                    </div>
                </div>
            </div>
            <!-- Vibration Card -->
            <div class="col-md-4 mb-3">
                <div class="card h-100 border-top border-success border-4">
                    <div class="status-card-body">
                        <h5 class="card-title text-secondary mb-2">Vibration (SW-420)</h5>
                        <h1 class="display-5 text-success fw-bold" id="vibration-value" style="text-shadow: 0 0 15px rgba(25, 135, 84, 0.5);">✅ SAFE</h1>
                        <span class="badge bg-dark border border-secondary mt-3 px-3 py-2">Status</span>
                    </div>
                </div>
            </div>
            <!-- Alert Card -->
            <div class="col-md-4 mb-3">
                <div class="card h-100 border-top border-danger border-4">
                    <div class="status-card-body">
                        <h5 class="card-title text-secondary mb-2">System Alert</h5>
                        <h1 class="display-5 text-success fw-bold" id="alert-value" style="text-shadow: 0 0 15px rgba(25, 135, 84, 0.5);">✅ NORMAL</h1>
                        <span class="badge bg-dark border border-secondary mt-3 px-3 py-2">Buzzer & LED</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Graphs Section -->
        <div class="row">
            <!-- Gas Graph -->
            <div class="col-md-12 mb-4">
                <div class="card shadow-sm">
                    <div class="graph-card-body">
                        <h5 class="card-title text-secondary mb-3 text-start">📈 Gas Readings (MQ-2)</h5>
                        <div style="height: 220px; width: 100%;">
                            <canvas id="gasChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Vibration Graph -->
            <div class="col-md-12 mb-4">
                <div class="card shadow-sm">
                    <div class="graph-card-body">
                        <h5 class="card-title text-secondary mb-3 text-start">📉 Vibration Readings (SW-420)</h5>
                        <div style="height: 220px; width: 100%;">
                            <canvas id="vibrationChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. SETUP CHART.JS (GAS)
        // ==========================================
        const ctxGas = document.getElementById('gasChart').getContext('2d');
        const gasChart = new Chart(ctxGas, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Gas Level (PPM)',
                    data: [],
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 4,
                    pointBackgroundColor: '#0f172a',
                    pointBorderColor: '#38bdf8',
                    pointBorderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#94a3b8' } } },
                scales: {
                    y: { beginAtZero: true, max: 1023, grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                },
                animation: { duration: 0 }
            }
        });

        // ==========================================
        // 2. SETUP CHART.JS (VIBRATION - Ginaya na natin ang Gas style)
        // ==========================================
        const ctxVib = document.getElementById('vibrationChart').getContext('2d');
        const vibrationChart = new Chart(ctxVib, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Vibration (0 = Safe, 1 = Detected)',
                    data: [],
                    borderColor: '#ef4444',
                    backgroundColor: 'rgba(239, 68, 68, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4, // <--- Binago natin from 0 to 0.4 para maging smooth curve
                    pointRadius: 4,
                    pointBackgroundColor: '#0f172a',
                    pointBorderColor: '#ef4444',
                    pointBorderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#94a3b8' } } },
                scales: {
                    y: { 
                        beginAtZero: true, 
                        max: 1.2, // <--- Binaba natin from 1.5 para hindi masyadong malaki yung space sa taas
                        ticks: { stepSize: 1, color: '#94a3b8' }, 
                        grid: { color: 'rgba(255, 255, 255, 0.05)' } 
                    },
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                },
                animation: { duration: 0 }
            }
        });

        // ==========================================
        // 3. UPDATE DASHBOARD FUNCTION
        // ==========================================
        async function updateDashboard() {
            try {
                const response = await fetch('/api/data');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();

                // Update Connection Status Indicator
                const statusDot = document.getElementById('status-dot');
                const statusText = document.getElementById('status-text');
                statusDot.className = 'status-dot dot-live';
                statusText.innerText = 'Connected to Supabase - IoT Real-time Dashboard';

                // Update Numbers (Gas)
                document.getElementById('gas-value').innerText = data.gas_value;
                
                // Update Vibration Status
                const vibText = data.vibration === 1 ? '⚠️ DETECTED' : '✅ SAFE';
                const vibElement = document.getElementById('vibration-value');
                vibElement.innerText = vibText;
                
                if (data.vibration === 1) {
                    vibElement.className = 'display-5 text-danger fw-bold';
                    vibElement.style.textShadow = '0 0 15px rgba(220, 53, 69, 0.5)';
                } else {
                    vibElement.className = 'display-5 text-success fw-bold';
                    vibElement.style.textShadow = '0 0 15px rgba(25, 135, 84, 0.5)';
                }

                // Check Alert Logic
                const alertElement = document.getElementById('alert-value');
                if (data.alert) {
                    alertElement.innerText = '🚨 ALERT!';
                    alertElement.className = 'display-5 text-danger fw-bold';
                    alertElement.style.textShadow = '0 0 15px rgba(220, 53, 69, 0.5)';
                } else {
                    alertElement.innerText = '✅ NORMAL';
                    alertElement.className = 'display-5 text-success fw-bold';
                    alertElement.style.textShadow = '0 0 15px rgba(25, 135, 84, 0.5)';
                }

                // Update Gas Chart
                gasChart.data.labels = data.time_history;
                gasChart.data.datasets[0].data = data.gas_history;
                gasChart.update();

                // Update Vibration Chart
                vibrationChart.data.labels = data.time_history;
                vibrationChart.data.datasets[0].data = data.vibration_history;
                vibrationChart.update();

            } catch (error) {
                console.error("Error fetching data:", error);
                
                const statusDot = document.getElementById('status-dot');
                const statusText = document.getElementById('status-text');
                statusDot.className = 'status-dot dot-error';
                statusText.innerText = 'Connection Error - Retrying...';
            }
        }

        // 4. RUN EVERY 3 SECONDS
        setInterval(updateDashboard, 3000);
        updateDashboard(); // Initial run
    </script>
</body>
</html>
